name: Release

# Builds Windows, macOS and Linux bundles and attaches them to a GitHub
# Release. Runs when a version tag such as v1.1.0 is pushed. Pull requests
# that touch packaging, and manual runs from the Actions tab, build the
# bundles as artifacts without publishing anything.

on:
  push:
    tags:
      - "v*"
  pull_request:
    paths:
      - ".github/workflows/release.yml"
      - "scripts/package_*"
      - "Cargo.toml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            asset: dist/stviz-animate-ubuntu.tar.gz
          - os: windows-latest
            asset: dist/stviz-animate-windows.zip
          - os: macos-latest
            asset: dist/stviz-animate-mac.zip
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check the tag matches Cargo.toml
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)"
          if [[ "$tag" != "$version" ]]; then
            echo "::error::Tag v$tag does not match Cargo.toml version $version"
            exit 1
          fi

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-bundle
        if: runner.os == 'macOS'
        run: cargo install cargo-bundle --locked

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: ./scripts/package_ubuntu.sh

      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: ./scripts/package_mac.sh

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/package_windows.ps1

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ runner.os }}
          path: ${{ matrix.asset }}
          if-no-files-found: error

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" artifacts/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "stviz-animate $GITHUB_REF_NAME" \
            --generate-notes
